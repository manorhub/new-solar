<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Solar Rays -->
  <g stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="56" x2="256" y2="88"/>
    <line x1="256" y1="424" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="88" y2="256"/>
    <line x1="424" y1="256" x2="456" y2="256"/>
    <line x1="115" y1="115" x2="138" y2="138"/>
    <line x1="374" y1="374" x2="397" y2="397"/>
    <line x1="115" y1="397" x2="138" y2="374"/>
    <line x1="374" y1="138" x2="397" y2="115"/>
  </g>

  <!-- Solar Panel Array Base -->
  <rect x="136" y="136" width="240" height="240" rx="24" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Solar Grid Lines -->
  <line x1="136" y1="216" x2="376" y2="216" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="136" y1="296" x2="376" y2="296" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="216" y1="136" x2="216" y2="376" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7"/>
  <line x1="296" y1="136" x2="296" y2="376" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7"/>

  <!-- Golden Sun Core Accent -->
  <circle cx="256" cy="256" r="48" fill="url(#sunGrad)" stroke="#ffffff" stroke-width="4"/>
</svg>